<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taskline</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233b5bdb'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3.2' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <span>Taskline</span>
      </div>
      <form class="search" id="search-form" role="search">
        <input id="search-input" type="search" placeholder="Search  ( / )" aria-label="Search tasks" autocomplete="off">
      </form>
      <nav id="nav-main" class="nav"></nav>
      <div class="nav-heading">
        <span>Projects</span>
        <button class="icon-btn" id="add-project" title="Add project" aria-label="Add project">+</button>
      </div>
      <nav id="nav-projects" class="nav"></nav>
      <div class="nav-heading"><span>Labels</span></div>
      <nav id="nav-labels" class="nav"></nav>
      <div class="sidebar-foot">
        <nav id="nav-tools" class="nav"></nav>
        <div id="status" class="status"></div>
      </div>
    </aside>

    <main class="main">
      <header class="main-head">
        <button class="icon-btn menu-btn" id="menu-btn" aria-label="Toggle menu">&#9776;</button>
        <div class="title-wrap">
          <h1 id="view-title">Today</h1>
          <div id="view-sub" class="view-sub"></div>
        </div>
        <div id="view-actions" class="view-actions"></div>
      </header>

      <section id="composer" class="composer">
        <form id="quick-form" class="quick">
          <span class="quick-plus" aria-hidden="true">+</span>
          <input id="quick-input" autocomplete="off" aria-label="Add a task"
                 placeholder='Add a task, e.g. "Call mom tomorrow 5pm #Work @phone p1"'>
          <button type="button" class="btn ai" id="smart-add" title="Turn messy notes into tasks with AI">Smart add</button>
        </form>
        <div id="quick-preview" class="chips"></div>
      </section>

      <section id="content" class="content" aria-live="polite"></section>
    </main>

    <aside id="drawer" class="drawer" aria-hidden="true"></aside>
  </div>

  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status"></div>
</body>
</html>
